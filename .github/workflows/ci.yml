name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BasketballMcp.sln
      - run: dotnet build BasketballMcp.sln -c Release --no-restore -warnaserror
      - run: dotnet test BasketballMcp.sln -c Release --no-build --logger trx
      - run: dotnet run --project src/BasketballMcp -c Release --no-build -- --seed-sample
      - run: dotnet run --project src/BasketballMcp -c Release --no-build -- --demo
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
